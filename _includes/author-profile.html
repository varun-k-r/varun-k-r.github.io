<div class="academic-profile">
  <div class="academic-profile__text">
    <h2 class="academic-profile__name"><a href="{{ '/' | relative_url }}">{{ site.author.name }}</a></h2>
    <p class="academic-profile__role">{{ site.author.bio }}<br><a href="https://dornsife.usc.edu/poir/">University of Southern California</a></p>
    <div class="academic-profile__contact">
      <a href="{{ '/assets/documents/cv.pdf' | relative_url }}">Curriculum Vitae</a><br>
      <a href="mailto:varun.rama@usc.edu">varun.rama@usc.edu</a>
      <p><a href="https://scholar.google.com/citations?user=USpEzdIAAAAJ&amp;hl=en">Google Scholar</a></p>
    </div>
  </div>
  <a class="academic-profile__portrait" href="{{ '/' | relative_url }}"><img src="{{ site.author.avatar | relative_url }}" alt="{{ site.author.name }}" width="973" height="1365"></a>
</div>
